<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#4a3714"/>
      <stop offset="0.6" stop-color="#2a1f0b"/>
      <stop offset="1" stop-color="#120d04"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc96"/>
      <stop offset="0.45" stop-color="#d1a84f"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d68a"/>
      <stop offset="0.5" stop-color="#a8802f"/>
      <stop offset="1" stop-color="#6e4f17"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbe7ac"/>
      <stop offset="0.35" stop-color="#d9b25a"/>
      <stop offset="1" stop-color="#7d5a1c"/>
    </linearGradient>
    <radialGradient id="bell" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#140e04"/>
      <stop offset="1" stop-color="#4a3410"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Medallion -->
  <circle cx="256" cy="256" r="244" fill="#0c0803"/>
  <circle cx="256" cy="256" r="236" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="216" fill="#0c0803"/>
  <circle cx="256" cy="256" r="211" fill="url(#bg)"/>

  <g transform="translate(256 262) scale(0.86) translate(-272 -244)" filter="url(#shadow)">
    <path d="M 360.4 161.1 A 62 62 0 0 1 426.5 199.3" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" opacity="1.0"/>
<path d="M 362.1 124.7 A 98 98 0 0 1 457.1 179.5" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
<path d="M 369.0 88.5 A 134 134 0 0 1 485.0 155.5" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" opacity="0.55"/>

    <!-- Horn body -->
    <path d="M 100 326 C 168 342, 254 312, 330 200
             L 408 245
             C 308 372, 196 398, 106 362 Z"
          fill="url(#horn)" stroke="#3a2a0c" stroke-width="5" stroke-linejoin="round"/>
    <!-- Highlight along the top -->
    <path d="M 112 331 C 172 345, 250 316, 318 214" fill="none" stroke="#fff4cf"
          stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Bands -->
    <path d="M 172 336 C 177 352, 180 368, 178 384" fill="none" stroke="#3a2a0c" stroke-width="9" stroke-linecap="round"/>
    <path d="M 262 292 C 274 312, 284 334, 288 354" fill="none" stroke="#3a2a0c" stroke-width="9" stroke-linecap="round"/>
    <!-- Mouthpiece -->
    <rect x="84" y="325" width="24" height="40" rx="6" fill="url(#gold)" stroke="#3a2a0c" stroke-width="5"
          transform="rotate(14 96 345)"/>
    <!-- Bell opening -->
    <ellipse cx="369.0" cy="222.5" rx="49.0" ry="17"
             transform="rotate(30.0 369.0 222.5)"
             fill="url(#bell)" stroke="url(#gold)" stroke-width="7"/>
  </g>
</svg>
